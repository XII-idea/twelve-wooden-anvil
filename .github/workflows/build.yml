# ===================================================================
#  构建与发布
# -------------------------------------------------------------------
#  什么时候会跑：
#    · 推送代码 / 提交 PR   -> 构建 jar，在本次运行的 Artifacts 区下载
#    · 推送 v 开头的 tag    -> 构建 jar 并自动创建 Release（例：v1.0.1）
#    · Actions 页面手动触发 -> 可选任意分支，不推代码也能试构建
#
#  jar 文件名由 build.gradle 自动拼装，无需手动维护：
#    本地构建    woodenanvil-<MC主版本>-SNAPSHOT.jar
#    分支构建    woodenanvil-<MC主版本>-<短提交哈希>.jar
#    tag 构建    woodenanvil-<MC主版本>-<tag 去掉 v>.jar
# ===================================================================

name: 构建

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read          # 默认只读，只有发版任务单独提权

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 准备 Gradle（带依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 构建
        run: ./gradlew build

      - name: 保存 jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: 发版
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取回 jar
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
